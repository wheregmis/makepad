[workspace]
members = [
    "core",
    "components/button",
    "components/badge",
    "components/separator",
    "components/input",
    "components/label",
    "components/radio-group",
    "components/dropdown-menu",
    "components/scroll-area",
    "components/card",
    "components/checkbox",
    "components/switch",
    "components/slider",
    "components/avatar",
    "components/skeleton",
    "components/progress",
    "components/textarea",
    "components/input-otp",
    "components/form",
    "components/toggle",
    "components/toggle-group",
    "components/select",
    "components/breadcrumb",
    "components/popover",
    "components/dialog",
    "components/sheet",
    "components/drawer",
    "components/hover-card",
    "components/alert-dialog",
    "components/toast",
    "components/tooltip",
    "components/command",
    "components/context-menu",
    "components/table",
    "components/calendar",
    "components/accordion",
    "components/alert",
    "components/tabs",
    "components/carousel",
    "components/collapsible",
    "examples/shadecn-demo-docs",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Makepad Shadecn Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wheregmis/makepad"

[profile.dev]
opt-level = 1
