[workspace]
members = [
    "core",
    "components/button",
    "components/badge",
    "components/separator",
    "components/input",
    "components/label",
    "components/radio-group",
    "components/dropdown-menu",
    "components/scroll-area",
    "components/card",
    "components/checkbox",
    "components/switch",
    "components/slider",
    "components/avatar",
    "components/skeleton",
    "components/progress",
    "components/textarea",
    "components/input-otp",
    "components/form",
    "components/toggle",
    "components/toggle-group",
    "components/select",
    "components/combobox",
    "components/date_picker",
    "components/time_picker",
    "components/breadcrumb",
    "components/tabs",
    "components/navigation_menu",
    "components/pagination",
    "components/menubar",
    "components/resizable",
    "examples/shadecn-demo-docs",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Makepad Shadecn Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wheregmis/makepad"

[profile.dev]
opt-level = 1
