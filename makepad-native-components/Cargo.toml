[package]
name = "makepad-native-components"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Native UI component embedding for Makepad"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/makepad/makepad/"
repository = "https://github.com/makepad/makepad/"

[dependencies]
makepad-draw = { path = "../draw", version = "1.0.0" }
makepad-platform = { path = "../platform", version = "1.0.0" }
makepad-widgets = { path = "../widgets", version = "1.0.0" }
makepad-math = { path = "../libs/math", version = "1.0.0" }
makepad-live-id = { path = "../libs/live_id", version = "1.0.0" }

[target.aarch64-apple-darwin.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-darwin.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.x86_64-apple-ios.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-ios-sim.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }

[target.aarch64-apple-ios.dependencies]
makepad-objc-sys = { path = "../libs/objc-sys", version = "1.0.0" }
